---
name: Sync upstream
on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  workflows: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Merge upstream
        run: |
          git remote add upstream https://github.com/home-operations/k8s-schemas.git
          git fetch upstream
          git checkout main
          git merge upstream/main --no-edit
          git push
