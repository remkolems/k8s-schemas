---
name: Sync upstream
on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Merge upstream
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git remote add upstream https://github.com/home-operations/k8s-schemas.git
          git fetch upstream
          git checkout main
          git merge upstream/main --no-edit
          # Require the PAT to authenticate before any push
          curl -fsS -H "Authorization: Bearer ${GH_PAT}" https://api.github.com/user >/dev/null \
            || { echo "::error::GH_PAT failed API auth"; exit 1; }
          # Point origin at the PAT explicitly (overrides checkout's GITHUB_TOKEN)
          git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/remkolems/k8s-schemas.git"
          git push origin main
