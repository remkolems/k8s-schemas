---
name: Sync upstream
on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Merge upstream
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git remote add upstream https://github.com/home-operations/k8s-schemas.git
          git fetch upstream
          git checkout main
          git merge upstream/main --no-edit
          echo "=== credential config by scope ==="
          git config --list --show-origin | grep -iE 'extraheader|credential\.helper|insteadof' || echo "(none)"
          git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/remkolems/k8s-schemas.git"
          # -c overrides extraheader/helper at every config scope for this push
          git -c http.https://github.com/.extraheader= -c credential.helper= push origin main
